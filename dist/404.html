  (() => {
    const banner = document.getElementById("cookie-banner");
    const acceptBtn = document.getElementById("cookie-accept-btn");
    const declineBtn = document.getElementById("cookie-decline-btn");

    if (!banner || !acceptBtn || !declineBtn) return;

    function getCookie(name) {
      const match = document.cookie.match(new RegExp("(^|;\\s*)(" + name + ")=([^;]*)"));
      return match ? decodeURIComponent(match[3]) : null;
    }

    function setCookie(name, val, days = 365) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(val)}; expires=${expires}; path=/; SameSite=Lax`;
    }

    const consent = getCookie("cookie_consent") || localStorage.getItem("cookie_consent");
    if (!consent) {
      setTimeout(() => {
        banner.classList.remove("translate-y-8", "opacity-0", "pointer-events-none");
        banner.classList.add("translate-y-0", "opacity-100", "pointer-events-auto");
      }, 1200);
    }

    function dismiss(val) {
      setCookie("cookie_consent", val);
      localStorage.setItem("cookie_consent", val);
      banner.classList.remove("translate-y-0", "opacity-100", "pointer-events-auto");
      banner.classList.add("translate-y-8", "opacity-0", "pointer-events-none");
      setTimeout(() => {
        banner.remove();
      }, 600);
    }

    acceptBtn.addEventListener("click", () => dismiss("accepted"));
    declineBtn.addEventListener("click", () => dismiss("declined"));
  })();
